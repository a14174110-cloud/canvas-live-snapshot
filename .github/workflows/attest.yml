name: Attest release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attest (e.g. 1.0.2)'
        required: true
        default: '1.0.2'

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir assets \
            --pattern 'main.js' \
            --pattern 'manifest.json' \
            --pattern 'styles.css'
          ls -la assets

      - name: Attest main.js
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: assets/main.js

      - name: Attest manifest.json
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: assets/manifest.json

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: assets/styles.css